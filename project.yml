name: OC2OCCULUS
options:
  bundleIdPrefix: org.bop5ii.research
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
packages:
  OCCULUSCore:
    path: .
targets:
  OCCULUS:
    type: application
    platform: iOS
    sources:
      - path: iOS/OCCULUSApp
    dependencies:
      - package: OCCULUSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bop5ii.research.oc2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_NSCameraUsageDescription: "OC2 uses the camera only when you enable local live preview; it does not record or upload frames."
