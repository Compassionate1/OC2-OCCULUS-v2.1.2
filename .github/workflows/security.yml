name: OC2 security evidence

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.9"
      - name: Install pinned security tools and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/runtime.txt -r requirements/dev.txt
      - name: SAST - Bandit
        run: bandit -r services scripts research-python/src -x python-tests,research-python/tests -f json -o bandit.json
      - name: SCA - pip-audit
        run: pip-audit -r requirements/runtime.txt -f json -o pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-evidence
          path: |
            bandit.json
            pip-audit.json
          if-no-files-found: ignore

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
