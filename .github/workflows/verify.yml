name: OC2 verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./research-python
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python scripts/check_architecture.py
      - run: python -m unittest discover -s research-python/tests -v

  bom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_boms.py
      - run: git diff --exit-code -- compliance/
