name: Signed release evidence
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m pip install -e ./research-python
          PYTHONPATH=.:research-python/src python -m unittest discover -s tests -v
          PYTHONPATH=.:research-python/src python -m unittest discover -s research-python/tests -v
      - name: Generate manifest
        run: python scripts/release_manifest.py .
      - name: Attest manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
