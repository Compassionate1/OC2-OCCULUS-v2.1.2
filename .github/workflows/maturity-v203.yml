name: OC2 maturity evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference package
        run: python -m pip install -e ./research-python
      - name: Execute and measure tests
        run: python scripts/collect_telemetry.py --output artifacts/telemetry/python.jsonl --phase test -- python -m unittest discover -s research-python/tests -v
      - name: Execute and measure telemetry unit tests
        if: always()
        run: python scripts/collect_telemetry.py --output artifacts/telemetry/python.jsonl --phase telemetry-test -- python -m unittest discover -s tests -v
      - name: Summarize execution telemetry
        if: always()
        run: python scripts/summarize_telemetry.py artifacts/telemetry/python.jsonl --output artifacts/telemetry/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-execution-evidence
          path: artifacts/telemetry/
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure Swift tests
        run: python3 scripts/collect_telemetry.py --output artifacts/telemetry/swift.jsonl --phase swift-test -- swift test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-execution-evidence
          path: artifacts/telemetry/
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate declared source inventories
        run: python scripts/test_boms.py
      - name: Generate source-derived BOMs
        run: python scripts/generate_boms.py
      - name: Capture source BOMs
        uses: actions/upload-artifact@v4
        with:
          name: source-sbom-cbom
          path: |
            compliance/sbom.cyclonedx.json
            compliance/sbom.spdx.json
            compliance/cbom.cyclonedx.json
            compliance/source-hashes.json
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start real Kafka and TimescaleDB stack
        env:
          OC2_API_TOKEN: ci-test-token-not-production
          OC2_DB_PASSWORD: ci-test-db-not-production
        run: docker compose up --build -d --wait
      - name: Seed and validate persistence
        env:
          OC2_API_TOKEN: ci-test-token-not-production
        run: python scripts/collect_telemetry.py --output artifacts/telemetry/integration.jsonl --phase integration -- python scripts/integration_smoke.py
      - name: Collect failure diagnostics
        if: failure()
        run: docker compose logs --no-color > integration-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/telemetry/
            integration-logs.txt
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
