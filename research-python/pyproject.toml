[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bop5ii"
version = "1.0.0"
description = "RESTRICTED (user-defined) multisensory attention research simulator"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
bop5ii = "bop5ii.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
