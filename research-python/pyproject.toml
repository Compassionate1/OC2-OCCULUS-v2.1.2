[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "oc2-bop5ii"
version = "2.1.3"
description = "OC2/OCCULUS synthetic multisensory attention research model"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "OC2 Engineering"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: MacOS :: MacOS X",
]

[project.scripts]
oc2-research = "bop5ii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
testpaths = ["tests"]
